
name: Build Android Apps

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build_android:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # CUSTOMER APP
      - name: Create customer Flutter project
        run: flutter create --platforms=android --org com.hosurcitybesttaxi customer_build

      - name: Apply customer source
        run: cp customer-app/lib/main.dart customer_build/lib/main.dart

      - name: Add Supabase package to customer app
        working-directory: customer_build
        run: flutter pub add supabase_flutter

      - name: Build customer APK and AAB
        working-directory: customer_build
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # DRIVER APP
      - name: Create driver Flutter project
        run: flutter create --platforms=android --org com.hosurcitybesttaxi driver_build

      - name: Apply driver source
        run: cp driver-app/lib/main.dart driver_build/lib/main.dart

      - name: Add Supabase package to driver app
        working-directory: driver_build
        run: flutter pub add supabase_flutter

      - name: Build driver APK and AAB
        working-directory: driver_build
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # COLLECT APK AND AAB FILES
     
      - name: Collect release builds
        run: |
          mkdir -p output
          cp customer_build/build/app/outputs/flutter-apk/app-release.apk output/customer-app-release.apk
          cp customer_build/build/app/outputs/bundle/release/app-release.aab output/customer-app-release.aab
          cp driver_build/build/app/outputs/flutter-apk/app-release.apk output/driver-app-release.apk
          cp driver_build/build/app/outputs/bundle/release/app-release.aab output/driver-app-release.aab

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: taxi-android_builds
          path: output/*
          if-no-files-found: error
          retention-days: 14
